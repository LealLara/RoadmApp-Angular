<main class="auth-page">
  <section class="auth-panel" aria-labelledby="login-title">
    <div class="brand-row">
      <span class="brand-mark">R</span>
      <span>RoadmApp</span>
    </div>

    <div class="auth-heading">
      <p class="eyebrow">Acesso seguro</p>
      <h1 id="login-title">Entre na sua conta</h1>
      <p>Continue acompanhando sua rotina, metas e prioridades em um unico lugar.</p>
    </div>

    <form class="auth-form">
      <label for="email">E-mail</label>
      <input
        id="email"
        name="email"
        type="email"
        autocomplete="email"
        placeholder="voce@email.com"
        [(ngModel)]="email"
      >

      <label for="senha">Senha</label>
      <input
        id="senha"
        name="senha"
        type="password"
        autocomplete="current-password"
        placeholder="Digite sua senha"
        [(ngModel)]="senha"
      >

      <button class="primary-button" type="button" (click)="logar()">
        Entrar
      </button>
    </form>

    <button class="text-button" type="button" (click)="criarConta()">
      Criar novo acesso
    </button>
  </section>
</main>
