<div class="container">

  <div class="card">

    <h1>Criar Conta</h1>

    <input
      type="text"
      placeholder="Nome"
      [(ngModel)]="nome"
    >

    <input
      type="email"
      placeholder="E-mail"
      [(ngModel)]="email"
    >

    <input
      type="password"
      placeholder="Senha"
      [(ngModel)]="senha"
    >

    <button (click)="cadastrar()">
      Criar acesso
    </button>

  </div>

</div>
